server {
    listen 80;
    server_name redactie.example.com;
    # certbot voegt HTTPS automatisch toe — dit is de HTTP-versie
}

server {
    listen 443 ssl http2;
    server_name redactie.example.com;

    # SSL — ingevuld door certbot
    ssl_certificate     /etc/letsencrypt/live/redactie.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/redactie.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Gzip
    gzip on;
    gzip_types text/html text/css application/json application/javascript;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Grotere uploads voor feed-bestanden
    client_max_body_size 50M;

    # Proxy naar de Python-server
    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Langere timeout voor AI-calls (Pow Patrol)
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Statische bestanden direct serveren voor betere performance
    location /static/ {
        alias /opt/powned/data/dashboard/;
        expires 1h;
        add_header Cache-Control "public";
    }
}
